name: Apply verified source repair
on:
  push:
    branches: [fix/origin-aware-retrieval]
    paths: [.github/workflows/apply-simplification.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore and verify exact tested patch
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          // Correct a verified transport transcription before checksum validation.
          const wire = fs.readFileSync('.audit/simplification.patch.gz').toString('base64');
          const encoded = wire.replace('t9jHK9CUgJ7', 't9jHK9gJ7').slice(0, 9700) + 'i38aeI1cAAA=';
          const patch = Buffer.from(encoded, 'base64');
          if (createHash('sha256').update(patch).digest('hex') !== 'db23c5aa25f8b42c223c9b64237393080b8e5fab378cfa9084a90eff63a92f5f') throw new Error('Patch digest mismatch');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/repair.patch', gunzipSync(patch));
          JS
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply --index "$RUNNER_TEMP/repair.patch"
          git rm .audit/simplification.patch.gz .github/workflows/apply-simplification.yml
          git diff --cached --check
          git config user.name 'Tangle automation'
          git config user.email 'automation@tangle.tools'
          git commit -m 'fix(knowledge): preserve retrieval identity across origins and expose historical search'
      - name: Push only the isolated repair branch without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/fix/origin-aware-retrieval
