name: Surface knowledge receipt documentation

on:
  push:
    branches: [feat/knowledge-use-receipts-v1]

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/knowledge-use-receipts-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add the receipt path to the top-level README
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const path = 'README.md'
          let source = fs.readFileSync(path, 'utf8')

          function replaceOnce(needle, replacement, label) {
            const first = source.indexOf(needle)
            if (first < 0) throw new Error(`${label}: anchor not found`)
            if (source.indexOf(needle, first + needle.length) >= 0) {
              throw new Error(`${label}: anchor is not unique`)
            }
            source = source.replace(needle, replacement)
          }

          replaceOnce(
            'pnpm add @tangle-network/agent-knowledge@7.2.6 @tangle-network/agent-eval@0.145.11 @tangle-network/agent-interface@0.52.0',
            'pnpm add @tangle-network/agent-knowledge@8.0.8 @tangle-network/agent-eval@0.147.0 @tangle-network/agent-interface@1.0.0',
            'install versions',
          )

          replaceOnce(
            '| Search an existing package knowledge base | `createFileSystemSearchProvider` | package root |\n',
            '| Search an existing package knowledge base | `createFileSystemSearchProvider` | package root |\n| Isolate knowledge per run and inherit only declared ancestry | `createRunScopedStores` | package root |\n| Prove what knowledge was visible, retrieved, and selected for use | `createKnowledgeRetrievalReceipt`, `createKnowledgeUseReceipt` | package root |\n',
            'API chooser rows',
          )

          const searchAnchor =
            'Use `asRetrievalEvalRetriever()` to send the same search path into retrieval tests.\n'
          const receiptSection = `\n## Prove what the agent saw and used\n\nA page existing in a knowledge base, a page appearing in retrieval results, and a page influencing a decision are three different facts. The receipt APIs preserve those joins without pretending they prove the page is true or that it improved the outcome.\n\n```ts\nimport {\n  createKnowledgeRetrievalReceipt,\n  createKnowledgeUseReceipt,\n  createKnowledgeVisibilitySnapshot,\n} from '@tangle-network/agent-knowledge'\n\nconst visiblePages = await runStores.loadChain(runId)\nconst visibility = createKnowledgeVisibilitySnapshot(visiblePages)\n\nconst retrieval = createKnowledgeRetrievalReceipt({\n  runId,\n  query: 'prior verifier obstruction',\n  retriever: { id: 'hybrid-search', version: '1.0.0', configDigest },\n  visiblePages,\n  results,\n})\n\nconst use = createKnowledgeUseReceipt({\n  retrieval,\n  selectedRank: 1,\n  relation: 'extends',\n  consumer: { kind: 'artifact', uri: 'artifact://run/DECISION.md', digest },\n})\n\nconsole.log(visibility.snapshotDigest, retrieval.receiptDigest, use.receiptDigest)\n```\n\nELI5: the visibility snapshot is the bookshelf the agent was allowed to see, the retrieval receipt is the exact books search handed back, and the use receipt records which returned book the agent attached to a downstream decision or artifact.\n\nThe receipts are content-addressed and mutation-sensitive. They do **not** establish correctness, novelty, compliance, or causal lift; Eval owns those later judgments. Read [knowledge retrieval and use receipts](docs/knowledge-use-receipts.md) for the complete proof boundary, trace attributes, and experiment design.\n`
          if (!source.includes('## Prove what the agent saw and used')) {
            replaceOnce(searchAnchor, `${searchAnchor}${receiptSection}`, 'receipt README section')
          }

          replaceOnce(
            '- [Architecture and data model](docs/architecture.md)\n',
            '- [Architecture and data model](docs/architecture.md)\n- [Knowledge retrieval and use receipts](docs/knowledge-use-receipts.md)\n',
            'more detail receipt link',
          )

          fs.writeFileSync(path, source)
          EOF
      - name: Validate documentation and package
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test -- src/knowledge-use-receipts.test.ts
          pnpm build
      - name: Commit and remove this one-time workflow
        run: |
          rm .github/workflows/surface-knowledge-receipts-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs(evidence): add the knowledge provenance quickstart"
          git push
