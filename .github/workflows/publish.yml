name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify packed package lifecycle
        run: pnpm run verify:package

      - name: Install official Python optimizers
        run: |
          python -m venv .venv-official
          .venv-official/bin/python -m pip install --upgrade pip
          RPC_VERSION=$(node -e "const v=require('./package.json').dependencies['@tangle-network/agent-eval']; if (!/^\\d+\\.\\d+\\.\\d+$/.test(v)) throw new Error('agent-eval dependency must be exact'); console.log(v)")
          .venv-official/bin/python -m pip install \
            "agent-eval-rpc==$RPC_VERSION" \
            "gepa[full] @ git+https://github.com/gepa-ai/gepa.git@f919db0a622e2e9f9204779b81fe00cc1b2d808f" \
            "skillopt @ git+https://github.com/microsoft/SkillOpt.git@61735e3922efc2b90c6d6cab561e62e98452ca90"

      - name: Run packed package through official GEPA and SkillOpt
        run: pnpm run verify:official-optimizers
        env:
          AGENT_EVAL_TEST_PYTHON: ${{ github.workspace }}/.venv-official/bin/python

      - name: Verify tag/version lock
        run: |
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
              echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
              exit 1
            fi
          fi
          echo "Version locked: $NPM_VERSION"

  publish-npm:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Tokenless OIDC trusted publishing — no NPM_TOKEN to expire. The
      # id-token→credential exchange is an npm-CLI feature (>= 11.5.1; Node 22
      # bundles npm 10) and pnpm only signs provenance (the PUT then 404s on
      # auth), so upgrade npm and publish with it. This package has no
      # `workspace:` deps, so npm publish is safe. No setup-node registry-url:
      # it writes an empty-authToken .npmrc that blocks OIDC. Idempotent.
      # Requires the npmjs Trusted Publisher: org tangle-network, repo
      # agent-knowledge, workflow publish.yml.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on registry; skipping publish"
          else
            npm publish --provenance --access public
          fi
