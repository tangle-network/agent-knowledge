name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, ci-public]
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify packed package for every supported Eval minor
        run: |
          for version in $(node --input-type=module -e "import { evalCompatibilityVersions } from './scripts/lib/peer-range.mjs'; console.log(evalCompatibilityVersions.join(' '))"); do
            AGENT_KNOWLEDGE_EVAL_VERSION="$version" pnpm run verify:package
          done

      - name: Run official GEPA and SkillOpt for every supported Eval minor
        run: |
          for version in $(node --input-type=module -e "import { evalCompatibilityVersions } from './scripts/lib/peer-range.mjs'; console.log(evalCompatibilityVersions.join(' '))"); do
            AGENT_KNOWLEDGE_EVAL_VERSION="$version" pnpm run verify:official-optimizers
          done

      - name: Verify tag/version lock
        run: |
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
              echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
              exit 1
            fi
          fi
          echo "Version locked: $NPM_VERSION"

      # npm trusted publishing runs on GitHub-hosted runners only, so the hosted
      # publish job starts only when this version is not yet on npm.
      - name: Decide whether this release publishes
        id: registry
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null | grep -qx "$VERSION"; then
            echo "$NAME@$VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    needs: verify
    # Publish on a v* tag OR a manual dispatch — tokenless by default. The
    # Trusted Publisher on npmjs (package Settings → Trusted Publisher → GitHub
    # Actions: org tangle-network, repo agent-knowledge, workflow publish.yml, no
    # environment) mints a short-lived credential from the id-token.
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Attest every publish on both the OIDC path and the token fallback. The
      # `--provenance` flag says the same thing; the variable also covers a
      # publish an npm lifecycle script starts.
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The id-token→publish-credential exchange is an npm CLI feature (>= 11.5.1)
      # and Node 22 bundles npm 10, so install the CLI that can do the exchange.
      # npm 12.0.0 omitted a provenance dependency required by libnpmpublish;
      # 12.1.0 restores it. Pin the exact release that agent-sdk and agent-eval
      # publish with instead of a floating range.
      - name: Pin the npm CLI that supports trusted publishing
        run: |
          npm install -g npm@12.1.0
          test "$(npm --version)" = '12.1.0'

      # Tokenless by default. NPM_TOKEN is a break-glass fallback for repairing a
      # publish by hand; it is not set, and a token set here TAKES PRECEDENCE over
      # OIDC (agent-sdk #284: a repo token whose package scope missed three
      # packages made every publish 404 on the PUT), so leave it unset.
      - name: Configure npm auth (OIDC by default, token only when set)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # An empty _authToken line also blocks the exchange, which is why the
          # publish job takes no setup-node registry-url. Drop any such line, then
          # write one back only for a real token.
          sed -i '/_authToken/d' "$HOME/.npmrc" 2>/dev/null || true
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set --location=user //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo 'NPM_TOKEN is set: publishing with the token fallback, still attested.'
          else
            echo 'No NPM_TOKEN: publishing through npm trusted publishing (OIDC).'
          fi

      # pnpm only signs provenance — its PUT then 404s on auth — so publish with
      # npm. This package has no `workspace:` deps, so npm publish is safe.
      # Idempotent: a version already on the registry is skipped.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on registry; skipping publish"
          else
            npm publish --provenance --access public
          fi
