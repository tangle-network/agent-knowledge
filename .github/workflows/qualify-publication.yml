name: Qualify package publication

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      source_ref:
        type: string
        required: true
    outputs:
      publish:
        value: ${{ jobs.verify.outputs.publish }}

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'tangle-network/agent-knowledge'
    # Public repository: standard GitHub-hosted runners are free and keep package verification off
    # the shared Beelink deploy pool (dotfiles docs/processes/agent-work.md, runner policy).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publication.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit the immutable source before running package code
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$CALLER_SHA"
          test "$SOURCE_REF" = "$CALLER_REF"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # Existing maintenance releases use release/<major>.<minor>.x.
          # Read JSON only; no candidate script runs before ancestry admission.
          line=$(python3 -c 'import json,re; v=json.load(open("package.json"))["version"]; m=re.match(r"^(\d+)\.(\d+)\.",v); assert m, "invalid package version"; print("release/"+m[1]+"."+m[2]+".x")')
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            git fetch --no-tags origin "refs/heads/$line:refs/remotes/origin/$line"
            git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/$line"
          fi
          if [[ "$SOURCE_REF" == refs/tags/v* ]]; then
            git fetch --no-tags origin "$SOURCE_REF:$SOURCE_REF"
            test "$(git rev-parse "$SOURCE_REF^{commit}")" = "$SOURCE_SHA"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify packed package for every supported Eval minor
        run: |
          for minor in $(node --input-type=module -e "import { evalCompatibilityVersions } from './scripts/lib/peer-range.mjs'; console.log(evalCompatibilityVersions().join(' '))"); do
            # Each supported minor is verified at its newest published patch: agent-eval 0.217.0 was never published (0.217.1 was).
            version=$(node scripts/newest-eval-patch.mjs "$minor")
            AGENT_KNOWLEDGE_EVAL_VERSION="$version" pnpm run verify:package
          done

      - name: Run official GEPA and SkillOpt for every supported Eval minor
        run: |
          for minor in $(node --input-type=module -e "import { evalCompatibilityVersions } from './scripts/lib/peer-range.mjs'; console.log(evalCompatibilityVersions().join(' '))"); do
            # Each supported minor is verified at its newest published patch: agent-eval 0.217.0 was never published (0.217.1 was).
            version=$(node scripts/newest-eval-patch.mjs "$minor")
            AGENT_KNOWLEDGE_EVAL_VERSION="$version" pnpm run verify:official-optimizers
          done

      - name: Verify tag/version lock
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [[ "${SOURCE_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${SOURCE_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
              echo "::error::Tag/version mismatch: tag=$TAG_VERSION package=$NPM_VERSION."
              exit 1
            fi
          fi
          echo "Version locked: $NPM_VERSION"

      - name: Check whether this version needs publication
        id: publication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          if (!response.ok && response.status !== 404) throw new Error(`Registry returned ${response.status}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${response.status === 404}\n`);
          NODE

