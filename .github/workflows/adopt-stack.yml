# Adopt each new @tangle-network release: agent-eval's reusable workflow pins
# it, widens this package's own peer ranges to include it, runs the gate and
# merges one pull request on chore/adopt-stack.
name: Adopt stack

on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@d1e0b6ced9543ac287e7f9cc457920439363c638
    with:
      stack-ref: d1e0b6ced9543ac287e7f9cc457920439363c638
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test && pnpm build
      default-branch: main
      merge: true
    secrets: inherit
