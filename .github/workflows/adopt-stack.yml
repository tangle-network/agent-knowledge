# Adopt each new @tangle-network release: agent-eval's reusable workflow pins
# it, widens this package's own peer ranges to include it, runs the gate and
# merges one pull request on chore/adopt-stack.
name: Adopt stack

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@97099c2bee8a59f2d998a640b581ba05ebdf0cc6
    with:
      stack-ref: 97099c2bee8a59f2d998a640b581ba05ebdf0cc6
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test && pnpm build
      default-branch: main
      merge: true
    secrets: inherit
