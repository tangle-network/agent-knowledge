# Adopt each new @tangle-network release: agent-eval's reusable workflow pins
# it, widens this package's own peer ranges to include it, runs the gate and
# merges one pull request on chore/adopt-stack.
name: Adopt stack

on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@29aa169723c241d9093704ca9da6b47eab819f65
    with:
      stack-ref: 29aa169723c241d9093704ca9da6b47eab819f65
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test && pnpm build
      default-branch: main
      merge: true
    secrets: inherit
