name: CI

# Ordinary internal source PRs allocate no qualification runner. Release PRs,
# outside contributions, landed revisions and explicit verification retain it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'changeset-release/') ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release preparation compares the branch against its merge base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify packed package for every supported Eval minor
        run: |
          for version in $(node --input-type=module -e "import { evalCompatibilityVersions } from './scripts/lib/peer-range.mjs'; console.log(evalCompatibilityVersions().join(' '))"); do
            AGENT_KNOWLEDGE_EVAL_VERSION="$version" pnpm run verify:package
          done

  official-optimizers:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'changeset-release/') ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run official GEPA and SkillOpt for every supported Eval minor
        run: |
          for version in $(node --input-type=module -e "import { evalCompatibilityVersions } from './scripts/lib/peer-range.mjs'; console.log(evalCompatibilityVersions().join(' '))"); do
            AGENT_KNOWLEDGE_EVAL_VERSION="$version" pnpm run verify:official-optimizers
          done
