name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          AGENT_KNOWLEDGE_RUN_NETWORK_TESTS: '1'

      - name: Build
        run: pnpm build

      - name: Verify packed package lifecycle
        run: pnpm verify:package

  official-optimizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run packed package through official GEPA and SkillOpt
        run: pnpm verify:official-optimizers
